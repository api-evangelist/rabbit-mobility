name: Rabbit Mobility
description: 'Rabbit Mobility (Rabbit) is a clean-tech micro-mobility sharing company
  operating in Cairo and Giza, Egypt. Through its iOS and Android mobile apps, Rabbit
  offers shared standing electric scooters and electric bikes with two service models:
  on-demand "Unlock & Go" rides and multi-day "Day Rentals" that include delivery.
  The company reports covering more than one million kilometers and saving over 50
  tons of CO2 emissions. Rabbit is a portfolio company of 500 Global. As a consumer
  mobile-app business, Rabbit publishes no public developer API, SDKs, or API
  documentation at this time; this profile is maintained in the API Evangelist
  network for discovery and enrichment.'
